name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payment_router
          POSTGRES_PASSWORD: payment_router
          POSTGRES_DB: payment_router_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test
        env:
          # Sem NODE_ENV=test a aplicação não sobe: ela exige um JWT_SECRET
          # real em qualquer ambiente que não seja desenvolvimento/teste.
          # O Vitest já assume "test" por padrão, mas declarar aqui deixa a
          # intenção explícita e à prova de mudanças no runner.
          NODE_ENV: test
          POSTGRES_TEST_HOST: localhost
          POSTGRES_TEST_PORT: 5432
          POSTGRES_TEST_USER: payment_router
          POSTGRES_TEST_PASSWORD: payment_router
          POSTGRES_TEST_DB: payment_router_test

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          POSTGRES_TEST_HOST: localhost
          POSTGRES_TEST_PORT: 5432
          POSTGRES_TEST_USER: payment_router
          POSTGRES_TEST_PASSWORD: payment_router
          POSTGRES_TEST_DB: payment_router_test

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build check
        run: |
          npm install
          npm run build
